[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0-alpha"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.98.0"

[workspace.dependencies]
# Default features are empty: X25519 and scrypt are always built; armor, plugin, ssh, async and CLI stay off.
age = { version = "0.12.1", default-features = false }
anyhow = "1"
base64 = "0.23.1"
# The raw TSS2_RC of a TPM error the signing helper reports; the version tss-esapi already brings.
bitfield = "0.19.5"
# zeroize clears hasher state on drop, so the manifest key does not outlive its use; alloc is not needed.
blake2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
# The brotli response encoder (its writer API flushes per chunk), the response decoder (through brotli's re-export of
# brotli-decompressor's low-level stream API, so each step's output is bounded) and the decoder tests' reference encoder.
# Pure Rust; `std` brings the writer API and the standard allocator, which the decoder wraps in one that wipes the window.
# Large-window streams are refused.
brotli = { version = "8.0.4", default-features = false, features = ["std"] }
# The response body chunks the upstream client hands on; the version hyper and reqwest already use.
bytes = "1.12.1"
# The binary's argument parser. Default features are off: colour, suggestions and terminal-width detection are not
# needed, and leaving them out keeps their dependencies out of the build.
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
# Shell completion scripts for `completions`, generated from the same `Cli` definition. Default features are off.
clap_complete = { version = "4.6", default-features = false }
# The Linux package's man pages, generated from the same `Cli` definition by a test. Default features are off.
clap_mangen = { version = "0.3.3", default-features = false }
# Approval signing and verification. zeroize clears the software signer's private key and its expanded form on drop;
# std, fast tables and rand_core stay off: verify_strict needs no feature, and key generation fills the seed from
# getrandom directly.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"] }
# ECDSA P-256 verification of the TPM signer's approvals (algorithm `02`); the version age already brings. `ecdsa` is
# the narrowest feature that exposes the verifying key; std, pem and pkcs8 stay off. Its random-number trait is the
# rand_core 0.6 already in the build.
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
# gzip and deflate response decoding on the pure-Rust miniz_oxide backend (no C build), through the low-level `Decompress`
# API so each step's output is bounded. Default features are off: that drops only `runtime_detection`, so crc32fast falls
# back to its compile-time CPU features. flate2 hard-wires miniz_oxide's `simd` feature, which pulls simd-adler32, a crate
# with unsafe SIMD code that cannot be turned off from here.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# The HTTP/2 test upstream's server half, so the upstream client's HTTP/2 path is tested end to end; dev-only, and the
# version reqwest's `http2` feature already brings.
h2 = { version = "0.4.20", default-features = false }
# The request and response types the HTTP/2 test upstream exchanges with `h2`; dev-only, already in the lock tree.
http = { version = "1.5.0", default-features = false, features = ["std"] }
# The operating system's random source for the software signer's private key; the same version uuid already uses.
getrandom = { version = "0.4.3", default-features = false }
# Body adapters for the request server's own responses and its boxed response body; the version reqwest already brings.
http-body-util = { version = "0.1.5", default-features = false }
# The caller-facing HTTP/1.1 server. The version reqwest already brings, so the build gets no second copy; each crate
# enables only the roles and protocols it uses.
hyper = { version = "1.12.0", default-features = false }
# Tokio adapters for hyper: its I/O traits over a request stream and its timer for the header-read timeout. The version
# reqwest already brings.
hyper-util = { version = "0.1.21", default-features = false }
# Open-flag constants (O_NOFOLLOW, O_NONBLOCK, ELOOP) for state-file reads on Unix; already in the lock tree.
libc = { version = "0.2.191", default-features = false }
# Takes ownership of the sockets systemd passes by socket activation; `from_raw_fd` is unsafe, which this workspace
# forbids. Its only Unix dependency is libc, already in the lock tree.
listenfd = "1.0.2"
proptest = { version = "1.12", default-features = false, features = ["std"] }
# Test certificates for the upstream-trust tests. Default features are off so aws-lc-rs and its C build stay out; ring
# signs, as it does for rustls, and pem writes the PEM files the pinned-CA loader reads.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
# Random-number traits for caller-token generation; the version age 0.12 and the RustCrypto stack already use, so no second
# rand_core or getrandom enters the build. Only the binary enables the getrandom feature for OsRng.
rand_core = { version = "0.6.4", default-features = false }
# The upstream client. Default features are off. `rustls-tls-no-provider` brings rustls with no crypto provider, no root
# store and no platform verifier: the client takes the config built from its upstream trust, so neither the environment
# nor a desktop store can add a root. 0.12 rather than 0.13, whose provider-free rustls feature still pulls in
# rustls-platform-verifier. HTTP/1.1 is always built; `http2` adds HTTP/2; `stream` gives `Body::wrap_stream`, which
# forwards a caller's request body chunk by chunk without buffering it. No compression feature: response
# decompression is the service's own, so `Content-Encoding` stays visible to the scrubber. No cookies, json, blocking,
# socks or system-proxy.
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "rustls-tls-no-provider", "stream"] }
# The `Stream` trait of the request body the upstream client forwards; the version reqwest already uses.
futures-core = { version = "0.3.34", default-features = false }
# Safe syscall wrappers in the binary: rlimits and prctl (process) and mlockall (mm) for process hardening, SO_PEERCRED
# (net) so the admin socket can judge its peer without unsafe code, and tcgetattr/tcsetattr (termios) so the CLI turns
# terminal echo off for a secret prompt.
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "mm", "net", "termios", "fs"] }
# The outbound TLS client config. Default features are off: aws-lc-rs's build needs cmake, so ring is the crypto
# provider (it builds with a plain C compiler and uses the getrandom 0.2 already in the lock tree); `logging` stays off
# so rustls emits no `log` records at all; std and tls12 give rustls's default protocol versions, TLS 1.2 and 1.3.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
# PEM decoding of a route's pinned CA file. std gives the PEM reader and std::error::Error on its errors.
rustls-pki-types = { version = "1.15.1", default-features = false, features = ["std"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
# Parses the log records the logging tests capture; dev-only, and the crate tracing-subscriber's `json` feature brings.
serde_json = { version = "1", default-features = false, features = ["std"] }
# Compile-time trait checks in tests: secret-bearing types must not gain Clone, Display or serde impls.
static_assertions = "=1.1.0"
# SHA-256 of the message the TPM signing helper signs; the version p256 already brings, so nothing joins the build.
sha2 = { version = "0.10.9", default-features = false }
# Constant-time equality for digests; std and i128 are not needed.
subtle = { version = "2.6.1", default-features = false }
thiserror = "2"
log = "0.4.34"
# The binary's async runtime for its sockets; each crate enables only the features it uses. The policy crate's dependency
# guard keeps it out of iron-vault-policy.
tokio = { version = "1.54.1", default-features = false }
# The recovery key's QR code, drawn by the CLI from the text it already holds. No image, svg or pic features, and no
# dependencies of its own, so nothing else joins the build.
qrcode = { version = "0.14.1", default-features = false }
# Async TLS over tokio sockets with the same rustls build as the outbound client. Default features are off: they would
# select aws-lc-rs, whose build needs cmake, and turn on rustls's `logging`; ring and tls12 match the rustls entry.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1"
# The TPM signing helper's TPM access (`iron-vault-tpm-signer`, behind its `tpm` feature only), linking the system's
# libtss2-esys; no other crate depends on it, so the service never links tpm2-tss. Its random source is the getrandom
# 0.4 already in the build, so no third rand, rand_core or getrandom joins it.
tss-esapi = "7.7.0"
# `CancellationToken`, which withdraws a serving snapshot from the requests still running on it. Default features are off:
# the token needs none, and the version h2 and reqwest already bring is in the lock tree.
tokio-util = { version = "0.7.20", default-features = false }
# A logging facade only: the binary installs the subscriber. Default features would pull in the attribute macros.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# `registry` stacks the dependency log caps as their own layer; `json` writes each record as one JSON Lines object.
# `tracing-log` stays off: with no `log` backend installed, records that reqwest and rustls emit through the `log` crate
# are discarded rather than logged.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry", "std"] }
url = "2.5"
# The built-in trust anchors for upstreams without a pinned CA. They are compiled in, so neither SSL_CERT_FILE,
# SSL_CERT_DIR nor a desktop store can add to them.
webpki-roots = "1.0.11"
uuid = { version = "1.29.0", features = ["v4"] }
zeroize = "1.9.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Unoptimized, one scrypt at `PASSPHRASE_WORK_FACTOR` takes about 18 seconds, so a debug build's `init` (three of them)
# would run into the CLI's 60-second socket timeout, and the end-to-end tests could not use the real work factor.
# Optimized, it takes about half a second. Release builds are unaffected.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

# Full debug info made each of the binary crate's test executables about 230 MB, and linking many of them at once ran
# the machine out of memory. Line tables keep file and line numbers in backtraces at a fraction of the size. The
# integration tests are also grouped into a few binaries under `tests/<group>/`, each linking the library once.
[profile.dev]
debug = "line-tables-only"

# Dependencies' debug info is rarely stepped into, so leave it out entirely.
[profile.dev.package."*"]
debug = false

[profile.release]
debug = false
strip = true
