[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.0"

[workspace.dependencies]
anyhow = "1"
proptest = { version = "1.12", default-features = false, features = ["std"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
url = "2.5"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
