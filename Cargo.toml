[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.0"

[workspace.dependencies]
# Default features are empty: X25519 and scrypt are always built; armor, plugin, ssh, async and CLI stay off.
age = { version = "0.12.1", default-features = false }
anyhow = "1"
base64 = "0.23.1"
# zeroize clears hasher state on drop, so the manifest key does not outlive its use; alloc is not needed.
blake2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
# A logging facade only: the binary installs the subscriber. Default features would pull in the attribute macros.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
url = "2.5"
uuid = { version = "1.29.0", features = ["v4"] }
zeroize = "1.9.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
