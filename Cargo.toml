[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.0"

[workspace.dependencies]
# Default features are empty: X25519 and scrypt are always built; armor, plugin, ssh, async and CLI stay off.
age = { version = "0.12.1", default-features = false }
anyhow = "1"
base64 = "0.23.1"
# zeroize clears hasher state on drop, so the manifest key does not outlive its use; alloc is not needed.
blake2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
# Approval signing and verification. zeroize clears the software signer's private key and its expanded form on drop;
# std, fast tables and rand_core stay off: verify_strict needs no feature, and key generation fills the seed from
# getrandom directly.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"] }
# The operating system's random source for the software signer's private key; the same version uuid already uses.
getrandom = { version = "0.4.3", default-features = false }
proptest = { version = "1.12", default-features = false, features = ["std"] }
# Safe syscall wrappers for process hardening in the binary: rlimits and prctl (process) and mlockall (mm) only.
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "mm"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
# Compile-time trait checks in tests: secret-bearing types must not gain Clone, Display or serde impls.
static_assertions = "=1.1.0"
# Constant-time equality for digests; std and i128 are not needed.
subtle = { version = "2.6.1", default-features = false }
thiserror = "2"
toml = "1"
# A logging facade only: the binary installs the subscriber. Default features would pull in the attribute macros.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
url = "2.5"
uuid = { version = "1.29.0", features = ["v4"] }
zeroize = "1.9.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
