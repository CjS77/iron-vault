[book]
title = "Iron Vault"
description = "The Iron Vault user manual: installation, cookbook recipes and reference."
authors = ["CjS77"]
language = "en"
src = "src"

# Replaces the {{#glossary}} marker with design/glossary.md and points links that leave the book at the repository.
[preprocessor.repo-links]
command = "python3 preprocessors/repo_links.py"

# Draws ```mermaid blocks in the browser. `mdbook-mermaid install book` writes the two scripts named in
# additional-js; they are not committed, so they always match the pinned preprocessor version.
[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
git-repository-url = "https://github.com/CjS77/iron-vault"
edit-url-template = "https://github.com/CjS77/iron-vault/edit/main/book/{path}"
default-theme = "light"
preferred-dark-theme = "coal"
# The brand skin: iron-vault.css restyles mdbook to match the landing page and iron-vault.js puts the lockup, linking
# back to the landing page, in the menu bar. theme/head.hbs loads the brand stylesheet from src/assets.
additional-css = ["iron-vault.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "iron-vault.js"]

[output.html.search]
enable = true

# Checks every link between pages of the book. Web links are not fetched, so the check needs no network.
[output.linkcheck2]
follow-web-links = false
traverse-parent-directories = false
warning-policy = "error"
