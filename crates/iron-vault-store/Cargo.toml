[package]
name = "iron-vault-store"
description = "Iron Vault encrypted storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
age.workspace = true
blake2.workspace = true
ed25519-dalek.workspace = true
iron-vault-kinds = { path = "../iron-vault-kinds" }
iron-vault-policy = { path = "../iron-vault-policy" }
secrecy.workspace = true
subtle.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[features]
# Exposes `FaultFs`, the in-memory fault filesystem, so other crates' tests can inject faults and crashes into store
# writes. Off by default: it is a test double and never ships in the service.
test-support = []

[dev-dependencies]
proptest.workspace = true
serde.workspace = true
static_assertions.workspace = true

[lints]
workspace = true
