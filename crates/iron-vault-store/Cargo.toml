[package]
name = "iron-vault-store"
description = "Iron Vault encrypted storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
age.workspace = true
blake2.workspace = true
ed25519-dalek.workspace = true
flate2.workspace = true
getrandom.workspace = true
iron-vault-kinds = { path = "../iron-vault-kinds" }
iron-vault-policy = { path = "../iron-vault-policy" }
secrecy.workspace = true
subtle.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Exposes test doubles for other crates' tests: `FaultFs`, the in-memory fault filesystem that injects faults and
# crashes into store writes, and `seal_passphrase_envelope_for_tests` and `seal_signer_key_for_tests`, which seal at work
# factor 2 instead of 18. Off by default, and never enabled outside dev-dependencies: a weak passphrase envelope must
# never ship in the service.
test-support = []

[dev-dependencies]
proptest.workspace = true
serde.workspace = true
static_assertions.workspace = true

# Tests make FIFOs and read fd flags through system calls rather than by forking a helper: a fork shares this process's
# lock fds with the child until it execs, which can make a concurrent test's lock read as held.
[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true

[lints]
workspace = true
