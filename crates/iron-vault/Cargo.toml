[package]
name = "iron-vault"
description = "Iron Vault credential-injecting proxy service and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Builds the Development deployment profile: the invoking user runs the service, with no isolation from that user's
# malware. Never enable it in a packaged build; CI refuses a release build whose `--version` names it.
dev-mode = []

[dependencies]
anyhow.workspace = true
iron-vault-policy = { path = "../iron-vault-policy" }
# OsRng for caller-token generation; only the binary reaches for the operating system's random source.
rand_core = { workspace = true, features = ["getrandom"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

# Process hardening, the getuid call for trusted-path checks, the admin socket and its peer credentials are Linux-only
# for now; other platforms report them as unsupported without these syscalls.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true
# The admin server: a current-thread runtime, Unix sockets, request deadlines and the stop signals.
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "signal", "macros"] }

[dev-dependencies]
proptest.workspace = true
secrecy.workspace = true
serde.workspace = true
static_assertions.workspace = true
# The admin server tests stop the server on demand through a oneshot channel.
tokio = { workspace = true, features = ["rt", "macros", "sync"] }

[lints]
workspace = true
