[package]
name = "iron-vault"
description = "Iron Vault credential-injecting proxy service and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Builds the Development deployment profile: the invoking user runs the service, with no isolation from that user's
# malware. Never enable it in a packaged build; CI refuses a release build whose `--version` names it.
dev-mode = []
# Lets integration tests pin a test CA from PEM bytes (`UpstreamTrust::pinned_from_pem`), skipping the trusted-path rule
# that a test tree under a group-writable directory cannot pass. Only this crate's own dev-dependency enables it.
test-support = []

[dependencies]
anyhow.workspace = true
# The brotli response encoder and decoder.
brotli.workspace = true
# The upstream client's response body chunks, and the bytes the scrubber releases from them.
bytes.workspace = true
clap.workspace = true
# The gzip and deflate response decoders.
flate2.workspace = true
# The `Stream` trait of the upstream client's upstream body.
futures-core.workspace = true
# Credential kinds, the serving snapshot's resolver half: the pipeline resolves a record's material through them,
# and the scrubber watches for the scrub patterns they produce.
iron-vault-kinds = { path = "../iron-vault-kinds" }
iron-vault-policy = { path = "../iron-vault-policy" }
# The vault whose healthy credential records a serving snapshot holds.
iron-vault-store = { path = "../iron-vault-store" }
# OsRng for caller-token generation; only the binary reaches for the operating system's random source.
rand_core = { workspace = true, features = ["getrandom"] }
# The upstream client: the one outbound HTTP client, over the rustls config from the route's upstream trust.
reqwest.workspace = true
# Upstream trust: the outbound client's rustls config over the built-in roots or a route's pinned CA.
rustls.workspace = true
rustls-pki-types.workspace = true
# The vault passphrase `unlock` builds from the owner's input: the store takes it as a `SecretString`.
secrecy.workspace = true
thiserror.workspace = true
# The upstream client's deadline for response headers; reqwest itself runs on tokio on every platform.
tokio = { workspace = true, features = ["time", "sync"] }
# The serving snapshot's withdrawal signal: a request on a withdrawn snapshot stops where the transport permits.
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
tracing-subscriber.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

# Process hardening, the getuid call for trusted-path checks, the admin socket and its peer credentials, and the CLI's
# terminal handling are Linux-only for now; other platforms report them as unsupported without these syscalls.
[target.'cfg(target_os = "linux")'.dependencies]
# The request server: hyper serves HTTP/1.1 on each request stream; HTTP/2 from callers is not offered.
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# Adopting request listeners from systemd socket activation.
listenfd.workspace = true
rustix.workspace = true
# The admin server: a current-thread runtime, Unix sockets, request deadlines and the stop signals. The CLI uses the
# signal support too, to restore the terminal on SIGINT. The request server's connection limit is a semaphore (sync).
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "signal", "macros", "sync"] }
# TLS listeners: the acceptor that terminates TLS on an accepted TCP connection.
tokio-rustls.workspace = true

[dev-dependencies]
# Signs the approvals the config check tests commit, as the store's own test signer does.
ed25519-dalek.workspace = true
# Encodes the secrets the scrub tests expect the service to recognise.
base64.workspace = true
# This crate with `test-support`, so the integration tests can pin a test CA.
iron-vault = { path = ".", features = ["test-support"] }
# The store with `test-support`, so config check tests can build a vault and an approval in a temporary directory.
iron-vault-store = { path = "../iron-vault-store", features = ["test-support"] }
# The HTTP/2 test upstream: its server half and the request and response types it exchanges.
h2.workspace = true
http.workspace = true
# Checks that no `log` backend is installed, so dependency `log` records are discarded.
log.workspace = true
proptest.workspace = true
# A CA and leaf certificates for the upstream-trust tests, generated offline.
rcgen.workspace = true
serde.workspace = true
static_assertions.workspace = true
# Builds non-default `Limits` the way an installation does, from a `[limits]` table.
toml.workspace = true
# The admin server tests stop the server on demand through a oneshot channel; the request server tests pause time.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "test-util"] }

[lints]
workspace = true
