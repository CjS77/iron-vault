[package]
name = "iron-vault"
description = "Iron Vault credential-injecting proxy service and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Builds the Development deployment profile: the invoking user runs the service, with no isolation from that user's
# malware. Never enable it in a packaged build; CI refuses a release build whose `--version` names it.
dev-mode = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
iron-vault-policy = { path = "../iron-vault-policy" }
# OsRng for caller-token generation; only the binary reaches for the operating system's random source.
rand_core = { workspace = true, features = ["getrandom"] }
# Upstream trust: the outbound client's rustls config over the built-in roots or a route's pinned CA.
rustls.workspace = true
rustls-pki-types.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

# Process hardening, the getuid call for trusted-path checks, the admin socket and its peer credentials, and the CLI's
# terminal handling are Linux-only for now; other platforms report them as unsupported without these syscalls.
[target.'cfg(target_os = "linux")'.dependencies]
# Adopting request listeners from systemd socket activation.
listenfd.workspace = true
rustix.workspace = true
# The admin server: a current-thread runtime, Unix sockets, request deadlines and the stop signals. The CLI uses the
# signal support too, to restore the terminal on SIGINT.
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "signal", "macros"] }
# TLS listeners: the acceptor that terminates TLS on an accepted TCP connection.
tokio-rustls.workspace = true

[dev-dependencies]
# Checks that no `log` backend is installed, so dependency `log` records are discarded.
log.workspace = true
proptest.workspace = true
# A CA and leaf certificates for the upstream-trust tests, generated offline.
rcgen.workspace = true
secrecy.workspace = true
serde.workspace = true
static_assertions.workspace = true
# The admin server tests stop the server on demand through a oneshot channel.
tokio = { workspace = true, features = ["rt", "macros", "sync"] }

[lints]
workspace = true
